# Clash Verge Rev / Mihomo 配置文件模板
# 架构特色：
# 1. 默认混合端口 7897 + TUN：供电脑日常软件使用，国内直连、海外走普通 VPS，无需维护复杂域名分流规则。
# 2. 独立监听端口 7900：直通【🏠 家宽分流】策略组（select 不回落），供 Claude Safe 沙盒及指纹浏览器使用。
# 3. 开启本地控制接口 127.0.0.1:9097：配合 toggle-proxy 一键切换日常海外出口（VPS ↔ 家宽），国内始终直连。

mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
external-controller: 127.0.0.1:9097
secret: ""

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter: ['*.lan', '+.local', '+.msftconnecttest.com', '+.msftncsi.com']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [https://doh.pub/dns-query, 223.5.5.5]
  direct-nameserver: [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
  nameserver: [https://dns.cloudflare.com/dns-query, https://1.1.1.1/dns-query, 'tls://8.8.8.8:853']
  nameserver-policy:
    'geosite:cn': [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
    'geosite:geolocation-!cn': [https://dns.cloudflare.com/dns-query, https://1.1.1.1/dns-query, 'tls://8.8.8.8:853']
  fallback: []

tun:
  enable: true
  device: Mihomo
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
  mtu: 1500
  # 若需手动排除自建 VPS IP 避免回环，可取消下面注释填写：
  # route-exclude-address:
  #   - 你的VPS_IP/32

proxies:
  # 1. 你的普通外网 VPS 节点（供日常浏览/下载）
  - name: 🇺🇸 US-自建
    type: vless
    server: 你的VPS_IP
    port: 443
    uuid: 你的UUID
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.amazon.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 你的公钥
      short-id: 你的short_id

  # 2. 家宽节点（SOCKS5 链式代理通过自建 VPS 中转）
  - name: 🏠 Decodo-10001
    type: socks5
    server: isp.decodo.com
    port: 10001
    username: 你的用户名
    password: 你的密码
    udp: true
    dialer-proxy: 🇺🇸 US-自建

  - name: 🏠 Decodo-10002
    type: socks5
    server: isp.decodo.com
    port: 10002
    username: 你的用户名
    password: 你的密码
    udp: true
    dialer-proxy: 🇺🇸 US-自建

# 专属独立入站监听端口（核心逻辑）
# 7900: 所有连接 100% 绑定到家宽分流，绕过常规规则与切换影响
listeners:
  - name: claude-isp-mixed
    type: mixed
    listen: 127.0.0.1
    port: 7900
    proxy: 🏠 家宽分流

proxy-groups:
  # 日常海外出口：默认走 VPS，需要临时让主浏览器切家宽时可用 toggle-proxy 一键切到 🏠 家宽分流
  - name: 节点选择
    type: select
    proxies:
      - 🇺🇸 US-自建
      - 🏠 家宽分流

  # 沙盒专用家宽组：必须保持 select（不自动故障转移，断流即断网，防止回落）
  - name: 🏠 家宽分流
    type: select
    proxies:
      - 🏠 Decodo-10002
      - 🏠 Decodo-10001

rules:
  # 局域网与国内直连（无需再维护复杂海外域名分流规则）
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 电脑其余所有海外流量走【节点选择】（日常为 VPS，可一键切换为家宽）
  - MATCH,节点选择
